name: Dropbox Upload

on:
  schedule:
    - cron: "0 9 * * *"   # Every day at 12:00 GR (10:00 UTC)
    - cron: "0 14 * * *"   # Every day at 12:00 GR (10:00 UTC)
  workflow_dispatch: # run manually
  push:
    branches:
      - main

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get new Dropbox access token
        id: dropbox_token
        run: |
          ACCESS_TOKEN=$(curl -s -X POST https://api.dropboxapi.com/oauth2/token \
            -u "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET" \
            -d grant_type=refresh_token \
            -d refresh_token="$DROPBOX_REFRESH_TOKEN" | jq -r .access_token)

          if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token from Dropbox API"
            exit 1
          fi

          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}

      - name: Upload file to Dropbox
        run: |
          curl -X POST https://content.dropboxapi.com/2/files/upload \
            --header "Authorization: Bearer ${{ steps.dropbox_token.outputs.access_token }}" \
            --header "Dropbox-API-Arg: {\"path\": \"/test.txt\",\"mode\": \"add\",\"autorename\": true,\"mute\": false}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @test.txt
