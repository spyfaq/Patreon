name: Refresh Dropbox Token

on:
  workflow_call:   # so other workflows can "call" this one

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    outputs:
      access_token: ${{ steps.get_token.outputs.access_token }}

    steps:
      - name: Get Dropbox Access Token
        id: get_token
        run: |
          RESPONSE=$(curl -s -u "${{ secrets.DROPBOX_APP_KEY }}:${{ secrets.DROPBOX_APP_SECRET }}" \
            -d refresh_token=${{ secrets.DROPBOX_REFRESH_TOKEN }} \
            -d grant_type=refresh_token \
            https://api.dropbox.com/oauth2/token)

          echo "Full response: $RESPONSE"
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
