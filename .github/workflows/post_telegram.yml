name: Daily Telegram Post from Dropbox

on:
  schedule:
    - cron: "0 10 * * *"   # Every day at 12:00 GR (10:00 UTC)
    - cron: "15 16 * * 2" # Tuesday at 19:15 GR (16:15 UTC)
    - cron: "15 16 * * 5" # Friday at 19:15 GR (16:15 UTC)
  workflow_dispatch: # Allow manual run

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests
        
      - name: Get Dropbox Access Token
        run: |
          RESPONSE=$(curl -s -u "${{ secrets.DROPBOX_APP_KEY }}:${{ secrets.DROPBOX_APP_SECRET }}" \
            -d refresh_token=${{ secrets.DROPBOX_REFRESH_TOKEN }} \
            -d grant_type=refresh_token \
            https://api.dropbox.com/oauth2/token)

          echo "Full response: $RESPONSE"
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          # Set token as env variable for next steps or calling workflow
          echo "DROPBOX_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          
      - name: Run posting script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_TIER1: ${{ secrets.TELEGRAM_CHAT_ID_TIER1 }}
          TELEGRAM_CHAT_ID_TIER3: ${{ secrets.TELEGRAM_CHAT_ID_TIER3 }}
        run: python post_from_dropbox.py
