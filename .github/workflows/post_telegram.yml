name: Daily Telegram Post from Dropbox

on:
  schedule:
    - cron: "0 10 * * *"   # Every day at 12:00 GR (10:00 UTC)
    - cron: "15 16 * * 2" # Tuesday at 19:15 GR (16:15 UTC)
    - cron: "15 16 * * 5" # Friday at 19:15 GR (16:15 UTC)
  workflow_dispatch: # Allow manual run

jobs:
  refresh-token-job:
    uses: ./.github/workflows/dropbox_refresh.yml
    secrets: inherit

  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Run posting script
        env:
          DROPBOX_ACCESS_TOKEN: ${{ needs.refresh-token-job.outputs.access_token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_TIER1: ${{ secrets.TELEGRAM_CHAT_ID_TIER1 }}
          TELEGRAM_CHAT_ID_TIER3: ${{ secrets.TELEGRAM_CHAT_ID_TIER3 }}
        run: python post_from_dropbox.py
