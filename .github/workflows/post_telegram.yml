name: Re-post to Telegram

# Manual re-post of a day's already-generated files.
#
# This workflow used to run on its own schedule and pull the files from
# Dropbox. Both are gone: the files now live in this repo under
# history/<date>/, and the scheduled posting happens as a step inside
# predictions_pipeline.yml once generation has actually finished. Running
# it on a separate cron was unreliable -- the daily 09:00 UTC trigger
# fired two hours BEFORE the 11:00 generation run, so it consistently
# found nothing to post.
#
# Kept as workflow_dispatch so a failed or missed post can be retried
# without re-running the whole prediction pipeline.
on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run posting script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_TIER1: ${{ secrets.TELEGRAM_CHAT_ID_TIER1 }}
          TELEGRAM_CHAT_ID_TIER3: ${{ secrets.TELEGRAM_CHAT_ID_TIER3 }}
        run: python post_to_telegram.py
