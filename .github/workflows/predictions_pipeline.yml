name: Predictions Pipeline

on:
  schedule:
    # GitHub cron is ALWAYS UTC and never observes daylight saving, so the
    # UK times below are expressed at the BST offset (UTC+1). From late
    # October to late March the UK is on GMT (= UTC) and these land one
    # hour earlier in UK local time -- earlier means fewer fixtures and
    # odds published, never a missed run.
    - cron: "0 11 * * 0,1,3,4,6"  # Sun/Mon/Wed/Thu/Sat -- 11:00 UTC
    - cron: "0 13 * * 2"          # Tuesday  -- 14:00 BST
    - cron: "0 15 * * 5"          # Friday   -- 16:00 BST
  workflow_dispatch: # Allow manual run

permissions:
  contents: write  # needed so the 'posting' job can commit predictions into history/
  actions: write   # needed so check_fixtures.py can read/clear the FORCE_PROCEED_* override variable

jobs:
  majorleague:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Folders
        run: mkdir -p predictions_data/ model_params/

      - name: Restore model params cache (warm-start)
        uses: actions/cache@v4
        with:
          path: model_params/
          key: model-params-major-${{ github.run_id }}
          restore-keys: |
            model-params-major-

      - name: Check Major League Fixtures
        id: check_major_fixtures
        continue-on-error: true
        env:
          # Lets check_fixtures.py read/clear the FORCE_PROCEED_MAJORLEAGUE
          # repo variable, so this wait can be manually short-circuited
          # from the GitHub UI without cancelling the run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_fixtures.py majorleague --retries 3 --interval 600

      - name: Run Major League Predictions
        if: steps.check_major_fixtures.outputs.fixtures_found == 'true'
        run: python majorleague_predictions.py

      - name: Upload Major League predictions
        if: steps.check_major_fixtures.outputs.fixtures_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: majorleague-predictions
          path: predictions_data/*
          if-no-files-found: ignore

  minorleague:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Folders
        run: mkdir -p predictions_data/ model_params/

      - name: Restore model params cache (warm-start)
        uses: actions/cache@v4
        with:
          path: model_params/
          key: model-params-minor-${{ github.run_id }}
          restore-keys: |
            model-params-minor-

      - name: Check Minor League Fixtures
        id: check_minor_fixtures
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_fixtures.py minorleague --retries 3 --interval 600

      - name: Run Minor League Predictions
        if: steps.check_minor_fixtures.outputs.fixtures_found == 'true'
        run: python minorleague_predictions.py

      - name: Upload Minor League predictions
        if: steps.check_minor_fixtures.outputs.fixtures_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: minorleague-predictions
          path: predictions_data/*
          if-no-files-found: ignore

  international:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Folders
        run: mkdir -p predictions_data/ model_params/

      - name: Restore model params cache (warm-start)
        uses: actions/cache@v4
        with:
          path: model_params/
          key: model-params-international-${{ github.run_id }}
          restore-keys: |
            model-params-international-

      - name: Check International Fixtures
        id: check_international_fixtures
        continue-on-error: true
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_fixtures.py international --retries 3 --interval 600

      - name: Run International Competitions Predictions
        if: steps.check_international_fixtures.outputs.fixtures_found == 'true'
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: python international_predictions.py

      - name: Upload International predictions
        if: steps.check_international_fixtures.outputs.fixtures_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: international-predictions
          path: predictions_data/*
          if-no-files-found: ignore

  merge_and_tier:
    runs-on: ubuntu-latest
    needs: [majorleague, minorleague, international]  # Waits for all three
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Folders
        run: mkdir -p predictions_data/ publish/

      - name: Download Major League predictions
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: majorleague-predictions
          path: predictions_data/

      - name: Download Minor League predictions
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: minorleague-predictions
          path: predictions_data/

      - name: Download International predictions
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: international-predictions
          path: predictions_data/

      - name: Merge Predictions
        run: python predictions_merger.py

      - name: Publish Predictions
        # Replaces the old Tier Predictions + Best Bets steps. Reads the
        # merged predictions_data/merged-prediction-<date>.csv and writes
        # Public_*, VIP_*.txt, VIP_*.xlsx and BestBets_* into publish/, so
        # they ride along on the existing upload/download/posting/history
        # steps below without any changes to those.
        run: python publish_predictions.py

      - name: Upload Predictions
        uses: actions/upload-artifact@v4
        with:
          name: predictions
          path: publish/*        

  posting:
    runs-on: ubuntu-latest
    needs: [merge_and_tier]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Folders
        run: mkdir -p publish/

      - name: Download  predictions
        uses: actions/download-artifact@v4
        with:
          name: predictions
          path: publish/

      - name: Save predictions to history/
        run: |
          BATCH_DIR="history/$(date -u +%F)"
          mkdir -p "$BATCH_DIR"
          # publish/*.xlsx and *.txt are what update_results.py / predictions_statistics.py
          # look for later -- committing them here is what lets a scheduled run
          # days from now (Tuesday's job settling Friday's batch, or vice versa)
          # find this batch, since GitHub Actions runners don't keep local
          # disk between separate workflow runs.
          cp publish/*.xlsx publish/*.txt "$BATCH_DIR"/ 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Add predictions batch $(date -u +%F) to history/"

          # The branch is checked out once at job start, so any commit
          # landing on it before this push (another run, a manual push
          # during development, etc.) makes a plain 'git push' a
          # non-fast-forward rejection. Rebase our one commit onto
          # whatever is now at HEAD and retry -- our own change touches
          # only history/, so this is a same-file conflict only in the
          # unlikely case two runs settle the exact same day's batch at
          # the same time.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- fetching and rebasing.."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              echo "::error::Rebase failed -- likely a genuine conflict in history/, needs manual resolution."
              git rebase --abort
              exit 1
            fi
            sleep 5
          done
          echo "::error::Could not push after 5 attempts."
          exit 1

      - name: Post to Telegram
        # Runs here rather than on its own schedule. post_telegram.yml used
        # to fire daily at 09:00 UTC while generation ran at 11:00 -- it
        # looked for today's files two hours before they existed and posted
        # nothing. Timing it off a separate cron cannot be made reliable
        # either: check_fixtures alone waits up to 30 minutes, and fitting
        # 17 leagues takes minutes more, so the pipeline's total runtime
        # varies. Sequencing it as a step removes the guesswork entirely.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_TIER1: ${{ secrets.TELEGRAM_CHAT_ID_TIER1 }}
          TELEGRAM_CHAT_ID_TIER3: ${{ secrets.TELEGRAM_CHAT_ID_TIER3 }}
        run: python post_to_telegram.py
