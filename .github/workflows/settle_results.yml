name: Settle Results

# Runs shortly before each prediction-generation run (predictions_pipeline.yml),
# so the previous batch has had time to fully play out:
#   - Tuesday 10:00 UTC settles Friday's batch (Fri/Sat/Sun/Mon matches)
#     before Tuesday's 11:00 UTC generation run for Tue/Wed/Thu.
#   - Friday 12:30 UTC settles Tuesday's batch (Tue/Wed/Thu matches)
#     before Friday's 13:30 UTC generation run for Fri/Sat/Sun/Mon.
on:
  schedule:
    - cron: "00 10 * * 2" # Tuesday at 13:00 Greek (1h before generation)
    - cron: "30 12 * * 5" # Friday at 15:30 Greek (1h before generation)
  workflow_dispatch: # Allow manual run

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update results (settle outstanding VIP files in history/)
        run: python update_results.py

      - name: Rebuild statistics/dashboard charts
        run: python predictions_statistics.py

      - name: Commit updated history/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Settle results $(date -u +%F)"
            git push
          fi
