name: Settle Results

# Runs daily at 10:00 UTC, ahead of predictions_pipeline.yml's generation
# run (11:00 UTC most days; 13:00 Tuesday and 15:00 Friday, see that
# workflow). Each batch covers a rolling [09:00, next-day 09:00) window
# (see date_utils.py) rather than a plain calendar day -- so yesterday's
# generation run produced a batch spanning [yesterday 09:00, today
# 09:00). That window closes an hour before this job runs, so every match
# in the batch has kicked off and can be settled.
on:
  schedule:
    - cron: "00 10 * * *" # Daily at 13:00 Greek (1h before generation)
  workflow_dispatch: # Allow manual run

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update results (settle outstanding VIP files in history/)
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: python update_results.py

      - name: Rebuild statistics/dashboard charts
        run: python predictions_statistics.py

      - name: Commit updated history/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Settle results $(date -u +%F)"

          # See predictions_pipeline.yml's "Save predictions to history/"
          # step for why this retries instead of a plain push -- the
          # branch can move between checkout and here (another run, a
          # manual push, etc.), which turns a plain 'git push' into a
          # non-fast-forward rejection.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- fetching and rebasing.."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              echo "::error::Rebase failed -- likely a genuine conflict in history/, needs manual resolution."
              git rebase --abort
              exit 1
            fi
            sleep 5
          done
          echo "::error::Could not push after 5 attempts."
          exit 1
