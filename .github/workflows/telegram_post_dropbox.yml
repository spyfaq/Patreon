name: Daily Telegram Post from Dropbox

on:
  schedule:
    - cron: "0 10 * * *"   # Every day at 12:00 GR (10:00 UTC)
    - cron: "15 16 * * 2"  # Tuesday at 19:15 GR (16:15 UTC)
    - cron: "15 16 * * 5"  # Friday at 19:15 GR (16:15 UTC)
  workflow_dispatch: # Allow manual run

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get new Dropbox access token
        id: dropbox_token
        run: |
          RESPONSE=$(curl -s -X POST https://api.dropboxapi.com/oauth2/token \
            -u "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET" \
            -d grant_type=refresh_token \
            -d refresh_token="$DROPBOX_REFRESH_TOKEN")
      
          echo "Raw response: $RESPONSE"
      
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r .access_token)
          if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token from Dropbox API"
            exit 1
          fi

          echo "DROPBOX_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Run posting script
        env:
          DROPBOX_ACCESS_TOKEN: ${{ env.DROPBOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_TIER1: ${{ secrets.TELEGRAM_CHAT_ID_TIER1 }}
          TELEGRAM_CHAT_ID_TIER3: ${{ secrets.TELEGRAM_CHAT_ID_TIER3 }}
        run: python post_from_dropbox.py
